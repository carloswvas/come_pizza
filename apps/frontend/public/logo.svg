<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Logo Oficial Come Pizza</title>
  <desc>Logo vetorial oficial do Come Pizza - Plataforma de delivery de pizza artesanal no forno a lenha.</desc>
  <defs>
    <!-- Fundo Focado Escuro -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>

    <!-- Gradiente de Chama & Forno a Lenha -->
    <linearGradient id="flame-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Gradiente do Queijo Ouro -->
    <linearGradient id="cheese-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Gradiente da Borda Tostada / Madeira -->
    <linearGradient id="crust-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Gradiente do Pepperoni / Brasa -->
    <linearGradient id="ember-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Sombra Brilhante para Destaque -->
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF4D4D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo de Quadrado Arredondado Escuro -->
  <rect width="120" height="120" rx="28" fill="url(#bg-gradient)"/>

  <!-- Anel Decorativo Suave de Brilho -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#flame-gradient)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 4"/>

  <!-- Grupo Principal do Símbolo com Sombra -->
  <g filter="url(#logo-shadow)">
    <!-- Silhueta Externa da Chama de Forno a Lenha -->
    <path d="M 60 16 C 67 27 90 50 90 71 A 30 30 0 0 1 30 71 C 30 50 53 27 60 16 Z" fill="url(#flame-gradient)"/>

    <!-- Recorte Escuro Interno para Contraste -->
    <path d="M 60 26 C 64 34 82 53 82 70 A 22 22 0 0 1 38 70 C 38 53 56 34 60 26 Z" fill="#14161D"/>

    <!-- Corpo da Fatia de Pizza de Queijo -->
    <path d="M 60 32 L 79 72 C 73 78 67 80 60 80 C 53 80 47 78 41 72 Z" fill="url(#cheese-gradient)"/>

    <!-- Borda Recheada / Tostada da Pizza -->
    <path d="M 39 71 C 46 78 74 78 81 71 C 83 75 80 81 73 83 C 66 85 54 85 47 83 C 40 81 37 75 39 71 Z" fill="url(#crust-gradient)"/>

    <!-- Chama Interna Brilhante (Efeito de Brilho do Queijo) -->
    <path d="M 60 38 C 62 44 68 53 68 59 C 68 63 64 67 60 67 C 56 67 52 63 52 59 C 52 53 58 44 60 38 Z" fill="#FFFBEB" opacity="0.95"/>

    <!-- Brasa de Pepperoni -->
    <circle cx="60" cy="53" r="4.5" fill="url(#ember-gradient)"/>
    <circle cx="51" cy="65" r="4" fill="url(#ember-gradient)"/>
    <circle cx="69" cy="65" r="4" fill="url(#ember-gradient)"/>
  </g>
</svg>
